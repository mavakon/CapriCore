name: macOS checks
on:
  pull_request:
  push:
    branches: [main, mac-port]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    # Apple silicon (arm64) runner. Standard runners are free for public repositories.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Runner
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu
          node --version
      - run: npm ci
      - name: Source checks (syntax, JSON, Python syntax, module boundaries)
        run: npm run check -- --require-python
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Unit tests (Windows-only failures are listed in tools/checks/known-failures.json)
        if: ${{ !cancelled() }}
        run: node tools/checks/test-known-failures.mjs
      - name: Source release check
        if: ${{ !cancelled() }}
        run: npm run release:check
      - name: Set up the macOS runtime (pinned llama.cpp Metal build and Electron)
        if: ${{ !cancelled() }}
        run: npm run setup:macos
      - name: macOS smoke check (doctor, bundled llama.cpp, tiny model chat)
        if: ${{ !cancelled() }}
        run: node tools/verify/verify-macos-smoke.mjs
      # Desktop (Electron) verifications against fixture servers. These are the
      # ones that pass on macOS; see docs/macos.md for the rest.
      - name: Desktop - companion settings
        if: ${{ !cancelled() }}
        run: node tools/verify/verify-companion-settings.mjs
      - name: Desktop - button feedback
        if: ${{ !cancelled() }}
        run: node tools/verify/verify-button-feedback.mjs
      - name: Desktop - languages
        if: ${{ !cancelled() }}
        run: npm run verify:languages
      - name: Desktop - window dimming
        if: ${{ !cancelled() }}
        run: npm run verify:dimming
      - name: Desktop - app catalog settings
        if: ${{ !cancelled() }}
        run: node tools/verify/verify-app-catalog-settings.mjs
      - name: Desktop - Spotify settings
        if: ${{ !cancelled() }}
        run: node tools/verify/verify-spotify-settings.mjs
      - name: Desktop - inference API
        if: ${{ !cancelled() }}
        run: node tools/verify/verify-inference-api.mjs
