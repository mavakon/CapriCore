<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'"
    />
    <link rel="stylesheet" href="menu-bar-panel.css" />
    <title>Capri</title>
  </head>
  <body>
    <div class="shadow" id="shadow">
      <div class="frame">
        <main class="panel" id="panel" aria-labelledby="panel-name">
          <header class="head">
            <span class="portrait" aria-hidden="true"><img src="/headpat-face.png" alt="" /></span>
            <span class="identity">
              <span class="name" id="panel-name">CAPRI</span>
              <span class="status" id="panel-status" role="status"></span>
            </span>
          </header>
          <form class="ask" id="ask" autocomplete="off">
            <label class="sr" for="ask-text" id="ask-label">Message Capri</label>
            <input id="ask-text" type="text" maxlength="4000" spellcheck="false" />
            <button type="submit" id="ask-send" aria-label="Send message">
              <svg viewBox="0 0 44 52" aria-hidden="true">
                <path d="M27 1 3 26h15L12 47 38 17H23z" />
              </svg>
            </button>
          </form>
          <div class="tiles" id="tiles"></div>
          <nav class="actions" id="actions"></nav>
        </main>
      </div>
    </div>
    <script type="module" src="menu-bar-panel.mjs"></script>
  </body>
</html>
